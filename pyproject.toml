[project]
name = "racklift5"
version = "2.0.0"
description = "RackLift 5 v2 - parametric climbing rack robot: exact CAD export (build123d)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "build123d==0.13.0",
]

[project.optional-dependencies]
fem = ["gmsh>=4.13", "meshio"]   # mesher only; the CalculiX solver needs pixi

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []   # scripts, not an importable package
